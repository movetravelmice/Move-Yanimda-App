name: iOS Build and Upload to TestFlight

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: [ "main" ]

jobs:
  build_ios:
    name: Build and Upload iOS App
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Setup App Store Connect API Key File
        run: |
          mkdir -p ~/.appstoreconnect/private_keys/
          echo "${{ secrets.APPSTORE_P8_KEY }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8

      - name: Install Fastlane
        run: gem install fastlane

      - name: Fastlane Build & Upload
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8_KEY: ${{ secrets.APPSTORE_P8_KEY }}
          APPSTORE_TEAM_ID: ${{ secrets.APPSTORE_TEAM_ID }}
        working-directory: ./ios/App
        run: |
          # Create Fastfile dynamically inside fastlane folder
          mkdir -p fastlane
          cat << 'EOF' > fastlane/Fastfile
          default_platform(:ios)

          platform :ios do
            desc "Build and upload to TestFlight"
            lane :beta do
              # 1. Setup API Key
              api_key = app_store_connect_api_key(
                key_id: ENV["APPSTORE_KEY_ID"],
                issuer_id: ENV["APPSTORE_ISSUER_ID"],
                key_filepath: File.expand_path("~/.appstoreconnect/private_keys/AuthKey_#{ENV['APPSTORE_KEY_ID']}.p8"),
                in_house: false
              )

              # 2. Create/Download Certificates and Profiles
              cert(api_key: api_key)
              sigh(api_key: api_key, force: true, app_identifier: "com.move.travelapp")

              # 3. Update Xcode Project Settings to use manual signing with the downloaded profile
              update_code_signing_settings(
                path: "App.xcodeproj",
                use_automatic_signing: false
              )
              update_project_provisioning(
                xcodeproj: "App.xcodeproj",
                profile: ENV["sigh_com.move.travelapp_appstore_profile-path"],
                build_configuration: "Release"
              )
              update_project_team(
                path: "App.xcodeproj",
                teamid: ENV["APPSTORE_TEAM_ID"]
              )

              # 4. Build App
              build_app(
                project: "App.xcodeproj",
                scheme: "App",
                export_method: "app-store",
                xcargs: "DEVELOPMENT_TEAM='#{ENV['APPSTORE_TEAM_ID']}'"
              )

              # 5. Upload to TestFlight
              upload_to_testflight(api_key: api_key, skip_waiting_for_build_processing: true)
            end
          end
          EOF
          
          # Run Fastlane
          fastlane beta
